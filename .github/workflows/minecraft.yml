name: Build Minecraft contribution graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - assets/generate_minecraft_graph.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        run: |
          gh api graphql -F login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { contributionCount date } }
                  }
                }
              }
            }' > /tmp/contrib.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}

      - name: Render world
        run: python3 assets/generate_minecraft_graph.py /tmp/contrib.json assets/minecraft-graph.svg

      - name: Commit if changed
        run: |
          git config user.name "minecraft-bot"
          git config user.email "actions@github.com"
          git add assets/minecraft-graph.svg
          git diff --cached --quiet || git commit -m "⛏ rebuild contribution world"
          git push
